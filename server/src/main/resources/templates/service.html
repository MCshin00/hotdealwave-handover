<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${name}"></title><link rel="stylesheet" href="/style.css"></head>
<body>
<nav class="top"><span><a href="/">처음</a></span><span class="target">[[${target.name()}]] · 고정 커밋 [[${target.shortCommit()}]]</span></nav>
<header class="summary">
<h1 th:text="${name}"></h1>
<p class="line" th:text="|검증 범위: ${@view.verificationSummary(endpoints)}|"></p>
<p class="line" th:text="|디렉터리: ${service.path('directory').asText()} · compose 서비스: ${@view.fact(service.path('composeService'))}|"></p>
</header>
<h2 th:text="|엔드포인트 ${#lists.size(endpoints)}개|"></h2>
<p class="line" th:each="e : ${endpoints}" th:classappend="|op op-${#strings.toLowerCase(@view.plain(e.path('httpMethod')))}|">
  <a th:href="|/endpoints/${e.path('id').asText()}|" th:text="|${@view.plain(e.path('httpMethod'))} ${@view.plain(e.path('path'))}|"></a>
  <span th:text="|${e.path('handler').asText()} · ${@view.status(e)} · 응답 확인: ${@view.responseCheck(e.path('responseCheck'))}|"></span>
</p>
<h2>HTTP 호출</h2>
<p class="line" th:each="f : ${httpCalls}" th:text="|${f.path('id').asText()} → ${@view.fact(f.path('target'))}|"></p>
<h2>Kafka 발행</h2>
<p class="line" th:each="p : ${messagePublications}" th:with="t=${@view.topic(p)}">
  <span th:text="|${p.path('id').asText()} (${p.path('kind').asText()}) ${@view.status(p)} ${@view.evidence(p)} 토픽 |"></span>
  <a th:if="${t != null}" th:href="|/topics/${t}|" th:text="${t}"></a>
</p>
<h2>Kafka 구독</h2>
<p class="line" th:each="s : ${messageSubscriptions}" th:with="t=${@view.topic(s)}">
  <span th:text="|${s.path('id').asText()} ${@view.status(s)} ${@view.evidence(s)} 토픽 |"></span>
  <a th:if="${t != null}" th:href="|/topics/${t}|" th:text="${t}"></a>
</p>
<h2>환경변수</h2>
<p class="line" th:each="v : ${environmentVariables}" th:text="|${v.path('name').asText()} (${v.path('profile').asText()}, ${v.path('location').asText()}) 값: ${@view.fact(v.path('value'))}|"></p>
<h2>외부 자원</h2>
<p class="line" th:each="r : ${externalResources}" th:text="|${r.path('kind').asText()} 설정 근거 ${@view.texts(r.path('configurationEvidence'))} 코드 근거 ${@view.texts(r.path('codeEvidence'))}|"></p>
<h2>페이지 직렬화</h2>
<p th:if="${pageSerialization.isEmpty()}">추출 항목 없음</p>
<p class="line" th:each="s : ${pageSerialization}" th:text="|@EnableSpringDataWebSupport pageSerializationMode: ${@view.fact(s.path('mode'))}|"></p>
<h2 th:text="|오류 코드 ${#lists.size(errorCodes)}개|"></h2>
<p class="line" th:each="c : ${errorCodes}" th:text="${@view.errorCode(c)}"></p>
<h2>예외 처리기</h2>
<div th:each="h : ${exceptionHandlers}">
  <p class="line" th:text="${@view.handler(h)}"></p>
  <p class="line" th:each="l : ${@view.fields(h.path('body'))}" th:text="|    ${l}|"></p>
</div>
<th:block th:unless="${gatewayRejections.isEmpty()}">
<h2>Gateway 거부 응답</h2>
<p class="line" th:each="r : ${gatewayRejections}" th:text="${@view.rejection(r)}"></p>
</th:block>
<th:block th:unless="${unsupported.isEmpty()}">
<h2 th:text="|도구가 다루지 않는 방식 ${#lists.size(unsupported)}곳|"></h2>
<p class="note">형식에 담을 자리가 없어 따라가지 않은 곳이다. 이 서비스의 흐름에는 이 호출이 빠져 있다.</p>
<p class="line" th:each="u : ${unsupported}" th:text="|${u.path('mechanism').asText()}: ${u.path('description').asText()} ${@view.evidence(u)}|"></p>
</th:block>
<section th:replace="~{items :: items(${items})}"></section>
<script src="/app.js"></script>
</body>
</html>
