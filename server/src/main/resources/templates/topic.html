<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${topic.name()}"></title><link rel="stylesheet" href="/style.css"></head>
<body>
<p><a href="/">처음</a></p>
<h1 th:text="|토픽 ${topic.name()}|"></h1>
<p class="line">검증 범위: 코드만</p>
<section th:replace="~{items :: descriptions(${descriptions})}"></section>
<h2>발행</h2>
<p th:if="${topic.publications().isEmpty()}">확인된 발행 없음</p>
<div th:each="p : ${topic.publications()}">
  <h3><a th:href="|/services/${p.path('service').asText()}|" th:text="${p.path('id').asText()}"></a></h3>
  <p class="line" th:text="|종류: ${p.path('kind').asText()} · 확인 상태: ${@view.status(p)} ${@view.evidence(p)}|"></p>
  <p class="line" th:text="|설정 키: ${@view.fact(p.path('topicKey'))}|"></p>
  <p class="line" th:text="|환경변수: ${@view.fact(p.path('environment'))}|"></p>
  <p class="line" th:text="|토픽 실제 값: ${@view.fact(p.path('topicName'))}|"></p>
</div>
<h2>구독</h2>
<p th:if="${topic.subscriptions().isEmpty()}">확인된 구독 없음</p>
<div th:each="s : ${topic.subscriptions()}">
  <h3><a th:href="|/services/${s.path('service').asText()}|" th:text="${s.path('id').asText()}"></a></h3>
  <p class="line" th:text="|확인 상태: ${@view.status(s)} ${@view.evidence(s)}|"></p>
  <p class="line" th:text="|설정 키: ${@view.fact(s.path('topicKey'))}|"></p>
  <p class="line" th:text="|환경변수: ${@view.fact(s.path('environment'))}|"></p>
  <p class="line" th:text="|토픽 실제 값: ${@view.fact(s.path('topicName'))}|"></p>
</div>
<h2>발행 → 구독 연결</h2>
<p class="line" th:each="s : ${links}" th:text="${@view.step(s)}"></p>
<p class="line" th:each="w : ${unpublished}" th:text="|확인 안 됨 — ${w}|"></p>
<section th:replace="~{items :: items(${items})}"></section>
</body>
</html>
