plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.1.0'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.1.0'
    implementation 'com.openai:openai-java:4.86.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// The server reads only the verifier output, so refresh it first.
tasks.named('bootRun') { dependsOn ':verifier:run'; workingDir = rootProject.projectDir }
tasks.named('test') {
    dependsOn ':verifier:run'
    useJUnitPlatform()
    workingDir = rootProject.projectDir
}
