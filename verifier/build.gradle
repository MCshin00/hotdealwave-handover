plugins {
    id 'java'
}

repositories { mavenCentral() }

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    implementation 'com.networknt:json-schema-validator:2.0.4'
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// The schemas are the format documents themselves; the jar carries them so the verifier runs from any folder.
tasks.named('processResources') {
    from(rootProject.file('docs/format')) { include '*.schema.json'; into 'format' }
}
tasks.named('test') {
    useJUnitPlatform()
    workingDir = rootProject.projectDir
}
