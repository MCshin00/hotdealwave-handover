name: Check shared files
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shared-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python scripts/check_shared_files.py
